# Apply with real values via:  kubectl apply -f k8s/secret.yaml
# Do NOT commit the real secret file. Use sealed-secrets / external-secrets in prod.
apiVersion: v1
kind: Secret
metadata:
  name: careconnect-secrets
  namespace: careconnect
type: Opaque
stringData:
  SUPABASE_URL: "https://YOUR-PROJECT.supabase.co"
  SUPABASE_PUBLISHABLE_KEY: "REPLACE_ME"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_ME"
  TWILIO_API_KEY: "REPLACE_ME"
  LOVABLE_API_KEY: "REPLACE_ME"