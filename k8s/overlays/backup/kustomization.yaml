# Backup region (e.g. EU/AF secondary cluster — warm standby)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: careconnect
resources:
  - ../../namespace.yaml
  - ../../configmap.yaml
  - ../../secret.example.yaml
  - ../../deployment.yaml
  - ../../service.yaml
  - ../../ingress.yaml
  - ../../hpa.yaml
  - ../../pdb.yaml
patches:
  - target:
      kind: ConfigMap
      name: careconnect-config
    patch: |-
      - op: replace
        path: /data/APP_REGION
        value: backup-secondary
  - target:
      kind: Deployment
      name: careconnect-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: careconnect-web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 10